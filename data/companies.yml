# Company career boards to crawl, grouped by ATS platform.
#
# The slug is the identifier in the employer's own job-board URL, e.g.
#   https://boards.greenhouse.io/SLUG
#   https://jobs.lever.co/SLUG
#   https://jobs.ashbyhq.com/SLUG
#   https://apply.workable.com/SLUG
#   https://jobs.smartrecruiters.com/SLUG
#   https://SLUG.recruitee.com
#
# IMPORTANT: these slugs are a starting list and have NOT been verified
# against the live APIs. Companies move between ATS platforms regularly.
# Run `npm run ingest -- --verify-seeds` to see which ones resolve and
# prune the rest — a wrong slug is a harmless 404, not a crash.
#
# Display names are derived from the slug ("netflix" -> "Netflix"). For
# employers with stylised capitalisation, give the name explicitly:
#   - slug: ebay
#     name: eBay

greenhouse:
  - stripe
  - airbnb
  - dropbox
  - slug: doordash
    name: DoorDash
  - instacart
  - robinhood
  - databricks
  - figma
  - discord
  - reddit
  - twitch
  - coinbase
  - affirm
  - flexport
  - samsara
  - benchling
  - slug: gitlab
    name: GitLab
  - slug: sofi
    name: SoFi
  - cloudflare
  - asana

lever:
  - spotify
  - shopify
  - box
  - mistral
  - kandji
  - attentive
  - blend
  - lattice
  - fivetran

ashby:
  - slug: openai
    name: OpenAI
  - ramp
  - linear
  - vanta
  - clerk
  - deel
  - slug: posthog
    name: PostHog
  - modal
  - replit
  - supabase

workable:
  - blueground
  - persado
  - slug: e-food
    name: e-food

smartrecruiters:
  - Ubisoft
  - Visa
  - Bosch
  - slug: McDonalds
    name: McDonald's
  - Avery

# Both seeded slugs 404'd against the live API and were removed. Add
# verified Recruitee tenants here (they are the <slug> in <slug>.recruitee.com).
recruitee: []
