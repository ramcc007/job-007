<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Marketing Director – Gurgaon Job Radar</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="container">
  <header>
    <h1>🔎 Digital Marketing Director – Gurgaon Job Radar</h1>
    <div class="status-line">
      <span id="last-refreshed">Last refreshed: —</span>
      <span id="job-count"></span>
    </div>
  </header>

  <div class="filters">
    <input id="search-box" type="text" placeholder="Search title or company…" />

    <label>Source
      <select id="source-filter">
        <option value="all">All</option>
        <option value="naukri">Naukri</option>
        <option value="linkedin">LinkedIn</option>
        <option value="instahyre">Instahyre</option>
        <option value="indeed">Indeed</option>
        <option value="foundit">Foundit</option>
      </select>
    </label>

    <label>Work mode
      <select id="mode-filter">
        <option value="all">All</option>
        <option value="Remote">Remote</option>
        <option value="Hybrid">Hybrid (≤3 days office)</option>
        <option value="Unspecified">Unspecified</option>
      </select>
    </label>

    <label>Posted
      <select id="bucket-filter">
        <option value="recent" selected>Last 15 days</option>
        <option value="extended">16–30 days</option>
        <option value="all">All (≤30 days)</option>
      </select>
    </label>

    <button id="refresh-now">Refresh now</button>
  </div>

  <table id="jobs-table">
    <thead>
      <tr>
        <th>Posted</th>
        <th>Title</th>
        <th>Company</th>
        <th>Mode</th>
        <th>Salary</th>
        <th>Location</th>
        <th>Summary</th>
        <th>Apply</th>
      </tr>
    </thead>
    <tbody id="jobs-body">
      <tr><td colspan="8" class="empty-state">Loading…</td></tr>
    </tbody>
  </table>
</div>

<script src="/static/app.js"></script>
</body>
</html>
