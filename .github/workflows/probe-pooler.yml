name: Probe Supabase pooler

# One-off diagnostic: identifies which pooler host/port/username the project
# answers on, using a deliberately wrong password so nothing secret is used
# or logged. Manual trigger only.
# Manual only: it answered its question (this project lives on the aws-0
# shard) and there is no reason to re-run it on every push. Kept because the
# same question recurs whenever a Supabase connection string is set up by
# hand, and it answers it without needing the real password.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/probe-pooler.mjs
        env:
          SUPABASE_REF: vwocigleaieyfdeplmnd
          SUPABASE_REGION: ap-south-1
