name: Run a crawl

# Triggers a crawl on the deployed site, which is the only place with open
# network access to the job APIs.
#
# The credential is a SHORT-LIVED SIGNED TOKEN, never the master secret.
# This repository is public, so workflow files and run logs are world
# readable; a token that expires in minutes can sit there harmlessly, while
# INGEST_SECRET could not. Mint one with:
#
#   INGEST_SECRET=... node scripts/mint-ingest-token.mjs 20
on:
  push:
    paths: [".crawl-request.json"]
  workflow_dispatch:
    inputs:
      site_url:
        description: "Deployed site origin"
        required: true
      token:
        description: "Short-lived token from scripts/mint-ingest-token.mjs"
        required: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        id: request
        run: |
          set -euo pipefail
          if [ -f .crawl-request.json ]; then
            echo "url=$(jq -r .site_url .crawl-request.json)"   >> "$GITHUB_OUTPUT"
            echo "token=$(jq -r .token .crawl-request.json)"     >> "$GITHUB_OUTPUT"
            echo "limit=$(jq -r '.limit // empty' .crawl-request.json)" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ inputs.site_url }}"   >> "$GITHUB_OUTPUT"
            echo "token=${{ inputs.token }}"    >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger crawl
        run: |
          set -euo pipefail
          url="${{ steps.request.outputs.url }}/api/ingest"
          if [ -n "${{ steps.request.outputs.limit }}" ]; then
            url="$url?limit=${{ steps.request.outputs.limit }}"
          fi
          echo "POST $url"
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST "$url" \
            -H "X-Ingest-Token: ${{ steps.request.outputs.token }}" \
            --max-time 800)
          jq . response.json || cat response.json
          [ "$code" = "200" ] || { echo "::error::crawl failed with HTTP $code"; exit 1; }
