name: Crawl job sources

# Vercel's free tier caps cron at one run a day, so the schedule lives here
# instead — GitHub Actions gives free minute-level scheduling.
on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, off the hour to avoid the rush
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source names (blank = all)"
        required: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger crawl
        run: |
          set -euo pipefail
          url="${{ secrets.SITE_URL }}/api/ingest"
          if [ -n "${{ inputs.only }}" ]; then url="$url?only=${{ inputs.only }}"; fi
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST "$url" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            --max-time 600)
          cat response.json
          echo
          [ "$code" = "200" ] || { echo "ingest failed with HTTP $code"; exit 1; }
